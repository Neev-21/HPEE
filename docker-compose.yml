services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: hpee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hpee
      POSTGRES_USER: hpee_admin
      POSTGRES_PASSWORD: hpee_dev_password
    ports:
      - "5432:5432"
    volumes:
      - hpee_postgres_data:/var/lib/postgresql/data
      - ./database/scripts/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpee_admin -d hpee"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hpee-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./hardware_tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    container_name: hpee-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql+psycopg://hpee_admin:hpee_dev_password@postgres:5432/hpee
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-worker:
    build: .
    container_name: hpee-ingestion-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.app.engines.ingestion.worker"]
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - API_URL=http://api:8000/api/v1/sensor/readings
    depends_on:
      - mosquitto
      - api

volumes:
  hpee_postgres_data:
