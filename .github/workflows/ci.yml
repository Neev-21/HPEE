name: HPEE CI Pipeline

on:
  push:
    branches: [ main, "feat/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Backend CI & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: hpee_test
          POSTGRES_USER: hpee_admin
          POSTGRES_PASSWORD: hpee_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Engine Contracts & Syntax
        run: |
          python -m compileall backend/
          python -m compileall simulator/

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://hpee_admin:hpee_dev_password@localhost:5432/hpee_test
        run: |
          pytest -v tests/
